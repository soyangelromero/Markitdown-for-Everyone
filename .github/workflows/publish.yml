name: Publish to PyPI

# This workflow uses PyPI Trusted Publishing (OIDC); no API token is stored in the repo.
# The trusted publisher is configured on PyPI:
#   PyPI project: markitdown-for-everyone
#   Owner: soyangelromero
#   Repository: Markitdown-for-Everyone
#   Workflow: publish.yml
#   Environment: pypi
#
# It runs on every published GitHub release, or manually from the Actions tab.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
